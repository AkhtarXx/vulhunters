[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulhunters"
version = "2.1.0"
description = "Blockchain vulnerability research and Solidity audit tooling (under development)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "VulHunters Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.14",
]
security = ["slither-analyzer>=0.11,<1"]

[project.scripts]
vulhunters = "vulnhunter.unified_cli:app"
vulnhunters = "vulnhunter.unified_cli:app"
vulnhunter = "vulnhunter.unified_cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["requires_api: live provider tests", "integration: integration tests", "slow: slow tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff.lint.per-file-ignores]
# Typer requires Option and Argument descriptors in command signatures.
"src/vulnhunter/unified_cli.py" = ["B008"]
